name: Production smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL pública do ambiente a validar
        required: true
        default: https://mysticwarriors-ohio.onrender.com
        type: string
      expected_commit:
        description: Commit SHA esperado no Render (vazio = SHA do ref disparado)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Validate production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Production smoke
        env:
          EXPECTED_RELEASE: 1.0.0-rc.1
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: node scripts/smoke-production.mjs "${{ inputs.url }}"
