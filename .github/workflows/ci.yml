name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate SQLite Prisma client for tests
        run: bun run db:generate:test

      - name: Unit and contract tests
        run: bun run test

      - name: Functional HTTP audit
        env:
          DATABASE_URL: file:./ci-functional.db
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          rm -f ci-functional.db ci-functional.db-journal
          bun run dev > /tmp/mw-functional-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Servidor encerrou durante o boot"
              cat /tmp/mw-functional-server.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || {
            echo "Servidor não ficou pronto a tempo"
            cat /tmp/mw-functional-server.log
            exit 1
          }
          if ! bash scripts/e2e-audit.sh; then
            echo "===== LOG DO SERVIDOR ====="
            tail -n 300 /tmp/mw-functional-server.log
            exit 1
          fi
          if ! bash scripts/e2e-release-extended.sh; then
            echo "===== LOG DO SERVIDOR (SMOKE ESTENDIDO) ====="
            tail -n 400 /tmp/mw-functional-server.log
            exit 1
          fi

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Production build
        env:
          NODE_ENV: production
          MW_BUILD_PHASE: "1"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=game&sslmode=require
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          bun run db:generate
          bun run build
