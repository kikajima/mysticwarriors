services:
  - type: web
    name: mysticwarriors
    runtime: node
    branch: master
    # O Persistent Disk não está disponível durante o build. Use um SQLite
    # temporário apenas para satisfazer imports/geração estática nesta fase.
    buildCommand: mkdir -p /tmp/mystic-warriors-build && touch /tmp/mystic-warriors-build/custom.db && export DATABASE_URL=file:/tmp/mystic-warriors-build/custom.db && bun install --frozen-lockfile && bun run db:generate && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.4.2
      - key: DATABASE_URL
        value: file:/var/data/custom.db
      - key: ALLOW_EMPTY_DB_INIT
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    # Persistent Disk requer instância paga no Render. O serviço Free não
    # preserva SQLite local entre deploys/restarts.
    disk:
      name: mystic-warriors-data
      mountPath: /var/data
      sizeGB: 1
