services:
  - type: web
    name: mysticwarriors
    runtime: node
    branch: master
    # O build NÃO consulta produção. A URL abaixo é apenas sintaticamente
    # válida para gerar o Prisma Client e compilar o Next.js.
    buildCommand: export MW_BUILD_PHASE=1 && export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=game&sslmode=require' && bun install --frozen-lockfile && bun run db:generate && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.4.2
      # Configure no painel com o Session Pooler (porta 5432) do Supabase:
      # postgresql://postgres.PROJECT_REF:PASSWORD@...pooler.supabase.com:5432/postgres?schema=game&sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
